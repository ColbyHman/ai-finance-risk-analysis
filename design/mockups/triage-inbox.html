<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Triage Inbox — concept</title>
<style>
  :root {
    --slate-50:#f8fafc; --slate-100:#f1f5f9; --slate-200:#e2e8f0; --slate-300:#cbd5e1;
    --slate-400:#94a3b8; --slate-500:#64748b; --slate-600:#475569; --slate-700:#334155; --slate-900:#0f172a;
    --navy:#0f2340; --navy-light:#16365e;
    --blue-50:#eff6ff; --blue-600:#2563eb; --blue-700:#1d4ed8;
    --red-50:#fef2f2; --red-200:#fecaca; --red-500:#ef4444; --red-600:#dc2626; --red-700:#b91c1c;
    --green-50:#f0fdf4; --green-200:#bbf7d0; --green-600:#16a34a; --green-700:#15803d;
    --amber-50:#fffbeb; --amber-200:#fde68a; --amber-500:#f59e0b; --amber-600:#d97706; --amber-700:#b45309;
  }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Arial, Helvetica, sans-serif; background: var(--slate-50); margin:0; color: var(--slate-900); }
  .mono { font-family: "SF Mono", Consolas, monospace; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 24px 24px 60px; }
  .page-head { margin-bottom: 4px; }
  h1 { font-size: 19px; font-weight: 700; margin: 0 0 3px; letter-spacing: -0.01em; }
  .run-line { font-size:12px; color: var(--slate-500); display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .run-line a { color: var(--blue-600); text-decoration:none; font-weight:500; }
  .disclaimer-strip { margin: 14px 0 22px; padding: 10px 14px; background: var(--slate-100); border-radius: 8px; font-size:11.5px; color: var(--slate-500); line-height:1.5; }

  .group-head { display:flex; align-items:center; gap:8px; margin: 26px 0 10px; }
  .group-head:first-of-type { margin-top: 4px; }
  .group-dot { width:8px; height:8px; border-radius:50%; }
  .group-dot.act { background: var(--red-600); }
  .group-dot.watch { background: var(--amber-500); }
  .group-dot.none { background: var(--slate-300); }
  .group-title { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color: var(--slate-500); }
  .group-count { font-size:11.5px; color: var(--slate-400); font-family: monospace; }

  .item { background:#fff; border:1px solid var(--slate-200); border-radius:12px; padding: 14px 16px; margin-bottom:8px; display:flex; gap:14px; align-items:flex-start; cursor:pointer; transition: box-shadow .15s; }
  .item:hover { box-shadow: 0 2px 8px rgba(15,23,42,.06); }
  .item.act { border-left: 3px solid var(--red-500); }
  .item.watch { border-left: 3px solid var(--amber-500); }
  .item.none { border-left: 3px solid var(--slate-200); }

  .item-main { flex:1; min-width:0; }
  .item-top { display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom: 3px; }
  .item-ticker-row { display:flex; align-items:baseline; gap:8px; }
  .item-ticker { font-weight:700; font-size:15px; letter-spacing:-0.01em; }
  .item-weight { font-size:11px; color: var(--slate-400); font-family: monospace; }
  .status-chip { font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; padding: 2px 8px; border-radius: 999px; flex-shrink:0; }
  .status-chip.act { background: var(--red-50); color: var(--red-700); }
  .status-chip.watch { background: var(--amber-50); color: var(--amber-700); }
  .status-chip.none { background: var(--slate-100); color: var(--slate-500); }

  .item-headline { font-size:13px; font-weight:600; color: var(--slate-800); margin: 2px 0 4px; }
  .item-summary { font-size:12.5px; color: var(--slate-600); line-height:1.5; margin: 0 0 8px; }
  .item-foot { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .item-reason { font-size:11.5px; color: var(--slate-400); font-style:italic; }
  .mark-reviewed { font-size:11.5px; font-weight:600; color: var(--blue-700); background: var(--blue-50); border:none; border-radius:6px; padding: 4px 10px; cursor:pointer; flex-shrink:0; }

  .item-chart { flex-shrink:0; width:84px; }
  .item-chart svg { width:100%; height:40px; display:block; }
  .item-chart-label { font-size:9.5px; color: var(--slate-400); text-align:center; margin-top:2px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="page-head">
    <h1>Triage Inbox</h1>
    <div class="run-line">
      <span>Last run: 6 hours ago · 7 holdings checked · 1 fetch failure</span>
      <a href="#">View run log →</a>
    </div>
  </div>
  <div class="disclaimer-strip">This ranks holdings by how much attention recent evidence suggests they need — it is not a recommendation to buy, sell, or hold anything. Every claim below links to its source.</div>

  <div id="groups"></div>
</div>

<script>
const HOLDINGS = [
  {
    ticker: "NVDA", weight: "9.8%", status: "act",
    headline: "Two Form 4 insider sales this week, first since Q1",
    summary: "Since your last review: a cluster of director-level sales filed Tuesday, plus continued strong data-center order chatter. The insider activity is new; the demand story is unchanged.",
    reason: "New insider-selling cluster — thesis-relevant, not yet reflected in price",
    trend: [40,42,38,44,48,45,50,52],
  },
  {
    ticker: "AAPL", weight: "14.2%", status: "act",
    headline: "Two analyst downgrades cite China demand softness",
    summary: "Services revenue beat consensus, but two independent sell-side notes this week flagged a multi-quarter China risk — the first negative analyst commentary in five months on this name.",
    reason: "First negative analyst consensus shift in 5 months",
    trend: [60,58,59,55,56,52,53,49],
  },
  {
    ticker: "MSFT", weight: "6.3%", status: "watch",
    headline: "Azure growth deceleration flagged in two outlets, unconfirmed by filings",
    summary: "Secondary reporting (not yet a filing or earnings call) suggests Azure growth may be slowing next quarter. Single-sourced so far — worth watching, not acting on.",
    reason: "Unverified single-source claim — watch for confirmation",
    trend: [70,71,69,70,68,69,67,68],
  },
  {
    ticker: "BND", weight: "8.5%", status: "watch",
    headline: "Fed minutes lean toward a slower rate-cut path",
    summary: "This week's FOMC minutes affect duration risk across the bond sleeve. No company-specific news (it's a fund) — flagged because it's the dominant driver of this position's risk this month.",
    reason: "Macro/rate driver, not fund-specific — portfolio-level relevance",
    trend: [50,49,48,47,48,46,45,44],
  },
  {
    ticker: "VTI", weight: "22.0%", status: "none",
    headline: "No notable news this week",
    summary: "Tracks its benchmark closely as expected. Included for completeness — nothing here changed your thesis.",
    reason: "No material change",
    trend: [55,56,55,57,56,58,57,58],
  },
  {
    ticker: "VXUS", weight: "9.0%", status: "none",
    headline: "No notable news this week",
    summary: "International index fund, broad diversified exposure. No fund-level events this period.",
    reason: "No material change",
    trend: [48,47,48,49,48,49,50,49],
  },
  {
    ticker: "Cash", weight: "3.0%", status: "none",
    headline: "No action — cash position",
    summary: "Held for rebalancing flexibility. Nothing to triage.",
    reason: "Not applicable",
    trend: null,
  },
];

function spark(values) {
  if (!values) return `<div class="item-chart-label" style="margin-top:14px;">n/a</div>`;
  const w=84,h=40;
  const min = Math.min(...values), max = Math.max(...values);
  const range = max - min || 1;
  const pts = values.map((v,i) => [ (i/(values.length-1))*w, h - 4 - ((v-min)/range)*(h-8) ]);
  const line = pts.map((p,i) => (i===0?"M":"L") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const area = line + ` L ${w} ${h} L 0 ${h} Z`;
  const up = values[values.length-1] >= values[0];
  const stroke = up ? "#16a34a" : "#ef4444";
  const gid = "g"+Math.random().toString(36).slice(2,7);
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${stroke}" stop-opacity=".25"/><stop offset="100%" stop-color="${stroke}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#${gid})"/>
    <path d="${line}" fill="none" stroke="${stroke}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </svg><div class="item-chart-label">30d sentiment</div>`;
}

const GROUPS = [
  { key: "act", label: "Act" },
  { key: "watch", label: "Watch" },
  { key: "none", label: "No action" },
];
const container = document.getElementById("groups");
GROUPS.forEach(g => {
  const items = HOLDINGS.filter(h => h.status === g.key);
  if (!items.length) return;
  const head = document.createElement("div");
  head.className = "group-head";
  head.innerHTML = `<span class="group-dot ${g.key}"></span><span class="group-title">${g.label}</span><span class="group-count">${items.length}</span>`;
  container.appendChild(head);
  items.forEach(h => {
    const el = document.createElement("div");
    el.className = `item ${h.status}`;
    el.innerHTML = `
      <div class="item-main">
        <div class="item-top">
          <div class="item-ticker-row"><span class="item-ticker">${h.ticker}</span><span class="item-weight">${h.weight}</span></div>
          <span class="status-chip ${h.status}">${g.label}</span>
        </div>
        <p class="item-headline">${h.headline}</p>
        <p class="item-summary">${h.summary}</p>
        <div class="item-foot">
          <span class="item-reason">${h.reason}</span>
          <button class="mark-reviewed">Mark reviewed</button>
        </div>
      </div>
      <div class="item-chart">${spark(h.trend)}</div>
    `;
    container.appendChild(el);
  });
});
</script>
</body>
</html>
