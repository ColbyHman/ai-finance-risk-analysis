services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-finance-risk-analysis
    env_file:
      - .env
    ports:
      - "3210:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
