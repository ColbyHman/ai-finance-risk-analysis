services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* vars must be build args, not just env_file entries —
      # Next.js inlines them into the client bundle at `next build` time.
      # docker compose reads these from .env in this directory for ${...}
      # substitution (a separate mechanism from env_file below).
      args:
        NEXT_PUBLIC_FINANCE_LIVE: ${NEXT_PUBLIC_FINANCE_LIVE:-}
        NEXT_PUBLIC_FINANCE_API_BASE: ${NEXT_PUBLIC_FINANCE_API_BASE:-}
    container_name: ai-finance-risk-analysis
    env_file:
      - .env
    ports:
      - "3210:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
